 skill.spellingTargets.forEach((w,i)=>{const box=el('div','',sec);box.className='card';el('label',(i<2?'入門：':'選做：')+'請拼出：'+w.meaning,box);el('button','聽完整單字',box).onclick=()=>say(w.word);const inp=el('input','',box);inp.type='text';inp.setAttribute('aria-label','拼寫 '+w.meaning);inp.autocomplete='off';inp.spellcheck=false;const prior=skillStore.read()?.units[unit.id]?.spelling?.[i];const out=el('p',prior?(prior.correct?'已保存：曾拼對此詞。':'已保存：此詞仍需練習。')+' 已練習 '+prior.tries+' 次。':'尚未練習此詞。',box);out.setAttribute('role','status');el('button','檢查拼寫',box).onclick=()=>{if(!normalizeSpelling(inp.value)){out.textContent='先輸入你的答案。';return;}if(skillToken!==lessonRenderGeneration)return;const correct=normalizeSpelling(inp.value)===normalizeSpelling(w.word);if(!skillStore.spelling(unit.id,i,correct)){refreshProgress();return;}out.textContent=correct?'拼對了！':'再試一次。正確拼法：'+w.word;refreshProgress();};el('button','清空重試',box).onclick=()=>{inp.value='';out.textContent='';};});
 const s=skill.speaking;el('h3','跟讀與自己說',sec);const model=el('p',s.model,sec);el('button','遮住／顯示示範句',sec).onclick=()=>{model.textContent=model.textContent===s.model?'（句子已遮住，試著自己說）':s.model;};el('button','聽示範句',sec).onclick=()=>say(s.model);el('p','先跟讀，再遮住示範句自己說一次。不錄音、不要求麥克風，也沒有自動發音評分。',sec);s.checklist.forEach(t=>el('p','□ '+t,sec));const spokenState=skillStore.read()?.units[unit.id]?.speaking;const result=el('p',spokenState==='self_reported'?'已保存口說自評；不是發音測驗通過。':spokenState==='needs_practice'?'已保存需再練習。':'尚未自評',sec);result.setAttribute('role','status');el('button','我已跟讀並自己說過',sec).onclick=()=>{if(skillToken!==lessonRenderGeneration)return;if(skillStore.speaking(unit.id,'self_reported'))result.textContent='已保存口說自評；不是發音測驗通過。';refreshProgress();};el('button','我需要再練習',sec).onclick=()=>{if(skillToken!==lessonRenderGeneration)return;if(skillStore.speaking(unit.id,'needs_practice'))result.textContent='已保存需再練習；可以請老師或家長協助。';refreshProgress();};

function render(){const renderToken=++lessonRenderGeneration;const renderedUnit=unit;englishSpeech?.stop(true);checked=new Set();$('#content').replaceChildren();el('h2',unit.title);const words=el('section');el('h2','單字與發音',words);const grid=el('div','',words);grid.className='grid';unit.vocabulary.forEach(v=>{const c=el('div','',grid);c.className='card';if(v.previewImage){const im=el('img','',c);im.src=v.previewImage;im.alt=v.word+' 教學圖片';im.loading='lazy';im.style.maxWidth='100%';im.style.maxHeight='240px';}el('strong',v.word,c);el('div',v.meaning,c);if(v.imageTeachingNote)el('p',v.imageTeachingNote,c);el('button','聽單字',c).onclick=()=>say(v.word);});renderThemeSupplement(unit);const grammar=el('section');el('h2','本課文法',grammar);unit.grammar.forEach(g=>{el('h3',g.target,grammar);el('p',g.explanation,grammar);g.examples.forEach(s=>el('p',s,grammar));});const support=el('section');if(unit.readingSupport.length){el('h2','讀前提示（本課先教）',support);unit.readingSupport.forEach(v=>el('p',v.phrase+'：'+v.meaning,support));}renderCoreSupplement(unit);const read=el('section');el('h2','原創短文',read);unit.passage.forEach(s=>el('p',s,read));el('button','朗讀整篇',read).onclick=()=>say(unit.passage.join(' '));const sent=el('section');el('h2','例句練習',sent);unit.sentences.forEach(s=>{const p=el('p',s+' ',sent);el('button','重聽',p).onclick=()=>say(s);});renderSkills(unit);const quiz=el('section');el('h2','閱讀與句型檢查',quiz);unit.questions.forEach((q,i)=>{const c=el('div','',quiz);el('h3',String(i+1)+'. '+q.prompt,c);if(q.spokenPrompt)el('button','播放題目單字',c).onclick=()=>say(q.spokenPrompt);const result=el('p','',c);result.setAttribute('role','status');const saved=progressStore.read()?.units[renderedUnit.id]?.active?.answers?.[i];if(Number.isInteger(saved)){checked.add(i);result.textContent=saved===q.answer?'答對了！':'再讀一次：正確答案是 '+q.options[q.answer];}q.options.forEach((o,j)=>{const b=el('button',o,c);b.disabled=Number.isInteger(saved);b.onclick=()=>{if(renderToken!==lessonRenderGeneration||checked.has(i))return;if(!progressStore.answer(renderedUnit.id,i,j)){refreshProgress();return;}checked.add(i);result.textContent=j===q.answer?'答對了！':'再讀一次：正確答案是 '+q.options[q.answer];c.querySelectorAll('button').forEach(n=>n.disabled=true);refreshProgress();};});});el('button','重新練習',quiz).onclick=()=>{if(renderToken!==lessonRenderGeneration)return;if(progressStore.restart(renderedUnit.id)){render();refreshProgress();}else refreshProgress();};}
DATA.units.forEach((u,i)=>{const o=el('option',u.grade+' 年級 / '+u.order+'：'+u.title,$('#grade'));o.value=i;});$('#grade').onchange=e=>{unit=DATA.units[Number(e.target.value)];render();renderNavigation();};$('#stop').onclick=()=>englishSpeech.stop(true);$('#grade').value=String(DATA.units.indexOf(unit));if(hostActive()){initializeNavigation();render();refreshProgress();}
