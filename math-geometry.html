<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>立體幾何教學桌｜學習星球</title><link rel="stylesheet" href="modules/math-teaching/geometry.css"></head><body>
<main><header><a href="index.html" id="back" class="icon-button" aria-label="返回數學" title="返回數學">←</a><div><small>LEARNING PLANET · 數學</small><h1>幾何教學桌</h1></div><span class="preview">互動教學</span></header>
<nav aria-label="幾何概念"><button data-mode="perimeter">▱ 周長</button><button data-mode="area">▦ 面積</button><button data-mode="volume" aria-pressed="true">▧ 體積</button><button data-mode="surface">▣ 表面積</button><a href="math-geometry.html?mode=shapes">◈ 形狀</a><a href="math-geometry.html?mode=space">◉ 空間</a></nav>
<div class="layout"><section class="stage"><form id="dimensions"><label>長<input name="l" aria-label="長" type="number" min="1" max="20" value="4" required></label><label>寬<input name="w" aria-label="寬" type="number" min="1" max="20" value="3" required></label><label id="height-field">高<input name="h" aria-label="高" type="number" min="1" max="20" value="2" required></label><fieldset><legend>單位</legend><button type="button" data-unit="cm" aria-pressed="true">cm</button><button type="button" data-unit="mm">mm</button><button type="button" data-unit="m">m</button></fieldset><button type="submit">套用</button><button id="voice-toggle" type="button" aria-label="開啟語音導覽" aria-pressed="false" title="開啟後，點各個按鈕可聽題目和說明">🔇</button></form>
<div id="scene"><div class="scene-hint">拖曳旋轉 · 滾輪／雙指縮放</div></div><div class="camera"><button id="home" class="icon-button" aria-label="三面視角" title="三面視角"><svg viewBox="0 0 24 24" width="27" height="27" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 22 7.5v9L12 22 2 16.5v-9Z"/><path d="m2 7.5 10 6 10-6M12 13.5V22"/></svg></button><button id="top">▤ 俯視</button><span id="scene-count"></span></div>
<div class="controls"><label id="layer-control">顯示層數 <input id="layers" aria-label="顯示層數" type="range" min="1" max="2" value="2"><output id="layer-value">2 / 2 層</output></label><label id="spread-control">拆開觀察 <input id="spread" aria-label="拆開程度" type="range" min="0" max="1" step="0.05" value="0"></label></div></section>
<aside><small>看得見的計算</small><h2 id="concept"></h2><div class="result" id="result"></div><p id="formula"></p><div id="steps"></div><div id="face-buttons" aria-label="選擇表面"></div><p id="feedback" role="status"></p><div class="actions"><button id="demo" class="icon-button" aria-label="播放堆疊" title="播放堆疊">▶</button><button id="hint">💡 提示</button><button id="review" class="icon-button" aria-label="回顧" title="回顧">⟳</button></div><p class="note">尺寸為 1～20 的整數。切換單位會保留數字，改變題目尺度，不是單位換算。</p></aside></div></main><script type="module" src="modules/math-teaching/geometry-entry.mjs"></script></body></html>
