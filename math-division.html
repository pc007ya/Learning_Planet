<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>長除法教學桌｜學習星球</title><link rel="stylesheet" href="modules/math-teaching/division.css"></head><body>
<main id="division-app"><header><a id="back" href="index.html">← 返回數學</a><div><small>LEARNING PLANET · 數學</small><h1>長除法教學桌</h1></div><span>互動教學</span></header>
<div class="layout"><section class="paper"><div class="paper-top"><div class="paper-title"><span id="equation"></span><span id="progress"></span></div><div class="paper-controls"><button id="demo-mode" aria-pressed="true" type="button">示範</button><button id="practice-mode" type="button">操作</button><details id="settings"><summary>題型</summary><div class="settings-body"><fieldset id="lengths"><legend>被除數位數</legend><button type="button" data-length="2">2 位</button><button type="button" data-length="3">3 位</button><button type="button" data-length="4" aria-pressed="true">4 位</button></fieldset><fieldset id="divisors"><legend>除數位數</legend><button type="button" data-divisor-length="1" aria-pressed="true">1 位</button><button type="button" data-divisor-length="2">2 位</button></fieldset></div></details><button type="button" id="random" aria-label="新一題" title="新一題">🎲</button><button id="voice-toggle" type="button" aria-label="開啟語音說明" aria-pressed="false" title="開啟後朗讀題目與操作步驟">🔇</button></div></div><div class="long-division" id="board"></div><div class="paper-buttons"><button id="show-answer" type="button" aria-pressed="false">查看完整直式</button><button id="restart" type="button">從頭開始</button></div></section>
<aside><h2 id="phase-title"></h2><p id="instruction"></p><div id="visual"><div id="visual-labels"><span id="left-label"></span><span id="right-label"></span></div></div><p class="legend">立體積木：大片是百、長條是十、小方塊是一。可拖曳旋轉。</p><form id="step-answer"><label id="answer-label">這一步<input id="step-input" name="value" type="number" min="0" autocomplete="off" required></label><button type="submit">核對這一步</button></form><p id="feedback" role="status"></p><div class="actions"><button id="hint" type="button">💡 提示</button><button id="next-demo" type="button">下一步 →</button><button id="play-demo" type="button">▶ 播放示範</button></div><div id="recap"></div></aside></div></main><script type="module" src="modules/math-teaching/division.mjs"></script></body></html>
