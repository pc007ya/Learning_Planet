<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>實驗橫放驗收框</title><style>body{margin:0;background:#091425;color:white;font:16px sans-serif}nav{height:50px;display:flex;align-items:center;gap:10px}button{padding:8px;color:white;background:#285677;border:1px solid #abc;border-radius:10px}iframe{display:block;border:0;width:1024px;height:600px}output{font-size:13px}</style><nav><button data-size="1024,600">1024 × 600</button><button data-size="1024,768">1024 × 768</button><button data-size="1280,720">1280 × 720</button><button id="measure">檢查溢出</button><output></output></nav><iframe src="../index.html" title="實際應用程式驗收框"></iframe><script>const frame=document.querySelector('iframe');document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{const [w,h]=b.dataset.size.split(',');frame.style.width=w+'px';frame.style.height=h+'px'});document.querySelector('#measure').onclick=()=>{const d=frame.contentDocument,v=frame.contentWindow;const bad=[...d.querySelectorAll('.cube-lab button,.cube-lab a')].filter(b=>{const r=b.getBoundingClientRect();return r.height&&(r.bottom>v.innerHeight||r.right>v.innerWidth||r.top<0||r.left<0)});document.querySelector('output').textContent=JSON.stringify({viewport:[v.innerWidth,v.innerHeight],page:[d.documentElement.scrollWidth,d.documentElement.scrollHeight],offscreenControls:bad.length})};</script></html>
