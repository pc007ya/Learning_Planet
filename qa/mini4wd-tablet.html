<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四驅車正式頁驗收</title><style>body{margin:0;background:#091425;color:white;font:14px system-ui}nav{display:flex;gap:8px;align-items:center;padding:8px;flex-wrap:wrap}button,a{padding:10px;color:white;background:#285677;border:1px solid #abc;border-radius:9px}iframe{display:block;border:0;width:1024px;height:600px;transform-origin:top left}output{font-size:14px}#frame-holder{height:600px}</style><nav><button data-size="1024,600">1024 × 600</button><button data-size="1024,768">1024 × 768</button><button data-size="1280,720">1280 × 720</button><button data-size="390,844">390 × 844</button><button id="measure">檢查溢出</button><output aria-live="polite"></output><a href="../mini4wd-lab.html">直接開啟</a></nav><div id="frame-holder"><iframe src="../mini4wd-lab.html" title="四驅車正式頁"></iframe></div><script>
const frame=document.querySelector('iframe');let w=1024,h=600;function fit(){const scale=Math.min(1,innerWidth/w);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+scale+')';document.querySelector('#frame-holder').style.height=h*scale+'px'}
for(const b of document.querySelectorAll('[data-size]'))b.onclick=()=>{[w,h]=b.dataset.size.split(',').map(Number);fit()};addEventListener('resize',fit);fit();
document.querySelector('#measure').onclick=()=>{const d=frame.contentDocument,v=frame.contentWindow;const outside=[...d.querySelectorAll('.m4-lab button')].filter(b=>{const r=b.getBoundingClientRect();return r.height&&r.width&&(r.bottom>v.innerHeight+.5||r.right>v.innerWidth+.5||r.top<0||r.left<0)}).map(b=>b.getAttribute('aria-label')||b.textContent);const panels=[...d.querySelectorAll('.m4-tools,.m4-lab')].map(el=>({name:el.className,client:[el.clientWidth,el.clientHeight],scroll:[el.scrollWidth,el.scrollHeight]}));document.querySelector('output').textContent=JSON.stringify({viewport:[v.innerWidth,v.innerHeight],page:[d.documentElement.scrollWidth,d.documentElement.scrollHeight],outside,panels})};
</script></html>
