name: Standalone page login checks
on:
  pull_request:
    paths:
      - 'auth-v2/**'
      - 'src/firebase-config.js'
      - 'tests/firebase-session-sdk.check.mjs'
      - 'index.html'
      - 'src/chinese-practice/**'
      - 'tests/chinese-practice-session.test.ts'
      - 'chinese*.html'
      - 'tests/page-access.check.mjs'
      - '.github/workflows/page-access-check.yml'
permissions:
  contents: read
jobs:
  access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/page-access.check.mjs
      - run: npm ci
      - run: npx vitest run tests/chinese-practice-session.test.ts
      - name: Install isolated real Firebase SDK regression fixtures
        run: npm install --prefix "$RUNNER_TEMP/auth-sdk" --no-save --ignore-scripts firebase@10.14.1 firebase-old@npm:firebase@10.12.2 fake-indexeddb@6.2.5
      - name: Reproduce old failure and verify unified SDK
        env:
          AUTH_SDK_TEST_ROOT: ${{ runner.temp }}/auth-sdk
        run: |
          node tests/firebase-session-sdk.check.mjs
          node tests/firebase-session-sdk.check.mjs --fixed
