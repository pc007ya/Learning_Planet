name: Standalone page login checks
on:
  pull_request:
    paths:
      - 'auth-v2/page-access*'
      - 'chinese*.html'
      - 'tests/page-access.check.mjs'
      - '.github/workflows/page-access-check.yml'
permissions:
  contents: read
jobs:
  access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/page-access.check.mjs
