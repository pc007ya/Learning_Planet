name: Fix iPad submodule gestures

on:
  push:
    paths:
      - '.github/workflows/fix-ipad-submodule-gesture.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch viewport and touch behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          viewport = '<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">'
          viewport_re = re.compile(r'<meta\s+name=["\']viewport["\'][^>]*>', re.I)
          if viewport_re.search(text):
              text = viewport_re.sub(viewport, text, count=1)
          elif re.search(r'<head\b[^>]*>', text, re.I):
              text = re.sub(r'(<head\b[^>]*>)', r'\1\n    ' + viewport, text, count=1, flags=re.I)

          marker = 'learning-planet-ipad-gesture-lock'
          if marker not in text:
              css = r'''
<style id="learning-planet-ipad-gesture-lock">
/* iPad/tablet landscape UX: the page stays fixed; intended interactive objects keep pointer control. */
*, *::before, *::after {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  max-width: 100%;
  margin: 0;
  overflow-x: hidden !important;
  overscroll-behavior-x: none;
  -webkit-text-size-adjust: 100%;
}

body {
  touch-action: manipulation;
}

/* Prevent wide media/panels from creating a horizontal page track. */
img,
video,
svg {
  max-width: 100%;
}

/* Canvas/experiment areas own their drag gestures instead of moving the page. */
canvas,
.interactive-canvas,
.experiment-stage,
.pixi-container,
[data-interactive="true"] {
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}

/* Common module shells must never exceed the visible tablet viewport. */
.learning-module,
.module-ui,
.module-panel,
.submodule,
.sub-module,
[class*="module-page"],
[class*="submodule"] {
  max-width: 100%;
  overflow-x: clip;
  overscroll-behavior-x: none;
}
</style>
'''
              if re.search(r'</head\s*>', text, re.I):
                  text = re.sub(r'</head\s*>', css + '\n</head>', text, count=1, flags=re.I)
              else:
                  text = css + '\n' + text

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify patch
        shell: bash
        run: |
          grep -q 'maximum-scale=1, user-scalable=no, viewport-fit=cover' index.html
          grep -q 'learning-planet-ipad-gesture-lock' index.html
          grep -q 'overflow-x: hidden !important' index.html
          grep -q 'touch-action: none' index.html

      - name: Commit patched index and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-ipad-submodule-gesture.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-ipad-submodule-gesture.yml
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'fix: lock submodule viewport gestures on iPad'
          git push origin HEAD:main
