name: Deploy static site to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply iPad submodule gesture lock
        run: python3 scripts/patch-ipad-ux.py
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check and build deployed modules
        run: python3 scripts/pack-nature-assets.py --verify-manifest && npm ci && npm run check
      - name: Stage public site without development dependencies
        run: |
          mkdir -p _site
          rsync -a --exclude='_site' --exclude='node_modules' --exclude='.git' --exclude='.github' --exclude='functions' --exclude='firebase-debug.log' --exclude='src' --exclude='tests' --exclude='modules/math-mission-map/v11/qa' --exclude='docs' --exclude='qa' --exclude='science-curriculum-preview.html' --exclude='nature-planet-preview.html' --exclude='*.check.mjs' --exclude='*.test.mjs' ./ _site/
          # index.html imports this runtime module; keep all other source private.
          mkdir -p _site/src
          cp src/firebase-config.js _site/src/firebase-config.js
          test -s _site/src/firebase-config.js
          cmp src/firebase-config.js _site/src/firebase-config.js
      - name: Inject Cloudflare Web Analytics
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("_site/index.html")
          html = path.read_text(encoding="utf-8")
          token = "97690c088436400287798663727583b5"
          snippet = """<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "97690c088436400287798663727583b5"}'></script><!-- End Cloudflare Web Analytics -->"""

          if token not in html:
              if "</body>" in html:
                  html = html.replace("</body>", snippet + "\n</body>", 1)
              else:
                  html += "\n" + snippet + "\n"
              path.write_text(html, encoding="utf-8")
          PY
      - name: Verify the already-published GitHub asset unit
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 0e39222ba892fbc823a884bad636cfb484501169
          git diff --exit-code FETCH_HEAD HEAD -- images/story images/story-vocabulary images/science images/math-grade1
          curl -fsSI --max-time 15 https://pc007ya.github.io/Learning_Planet_Assets/images/story/birthday-v1/apron.svg | tr -d '\r' | grep -Eiq '^access-control-allow-origin:[[:space:]]*\*$'
      - name: Stage the app separately and enforce the uncompressed Pages limit
        run: |
          set -euo pipefail
          python3 qa/language-3d-r9/two-pages-stage.py _site split
          sha256sum split/asset-integrity.json
          env PYTHONDONTWRITEBYTECODE=1 python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          app=Path('split/app')
          receipt=app/'language-3d-release.json'
          assert not receipt.exists()
          summary=json.loads(Path('split/split-report.json').read_text())
          receipt.write_text(json.dumps({
              'commit':os.environ['GITHUB_SHA'],
              'language3d':'r10',
              'appStagedBytes':summary['app']['bytes'],
              'assetStagedBytes':summary['assets']['bytes'],
          },sort_keys=True)+'\n')
          assert summary['app']['bytes'] + receipt.stat().st_size < 1_000_000_000
          PYTHON
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: split/app
      - name: Verify the actual compressed GitHub Pages archive
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          test -n "$ARTIFACT_ID"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --jq '.size_in_bytes' | tee "$RUNNER_TEMP/language-pages-archive-bytes.txt"
          test "$(cat "$RUNNER_TEMP/language-pages-archive-bytes.txt")" -lt 1000000000
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify the exact release on the official domain
        run: |
          set -euo pipefail
          for path in language-3d-release.json modules/chinese-planet/launch-r9.mjs modules/chinese-planet/map-r9.mjs modules/chinese-planet/world-r9.mjs modules/chinese-planet/map-navigation-r10.mjs modules/chinese-planet/map.css modules/english-original/launch.mjs modules/english-original/english-exploration-r10.mjs modules/english-original/english-garden-world-r10.mjs; do
            curl -fsS --retry 5 --retry-all-errors --max-time 15 "https://learnplanet.win/$path?release=$GITHUB_SHA" -o "$RUNNER_TEMP/live-r9"
            cmp "split/app/$path" "$RUNNER_TEMP/live-r9"
          done
          for route in chinese/ english/; do
            curl -fsS --retry 3 --max-time 15 "https://learnplanet.win/$route" | grep -q 'route-shell.js'
          done
