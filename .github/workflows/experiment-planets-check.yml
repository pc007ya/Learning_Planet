name: Verify 3D Experiment Planets
on:
  push:
    branches:
      - feature/experiment-planets-isolated-20261029
  pull_request:
    branches: [main]
    paths:
      - 'src/experiment-planets/**'
      - 'experiments/3d/**'
      - 'vite.experiment-planets.config.ts'
      - 'tests/experiment-planets.test.ts'
      - 'src/tides/**'
      - 'src/tides3d/**'
      - 'tests/tides3d.test.ts'
      - 'vite.tides3d.config.mjs'
      - 'scripts/verify-tides3d.mjs'
      - 'tests/tides.test.ts'
      - 'vite.tides.config.mjs'
      - 'scripts/verify-tides.mjs'
      - 'package.json'
      - 'index.html'
      - '.github/workflows/experiment-planets-check.yml'
permissions:
  contents: read
concurrency:
  group: experiment-planets-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Science and isolation tests
        run: npx vitest run tests/experiment-planets.test.ts tests/tides.test.ts tests/tides3d.test.ts
      - name: Build independent 3D engine
        run: npm run build:experiment-planets
      - name: Verify six independent pages and lazy chunks
        run: |
          test -s modules/experiment-planets/planet.js
          test -s experiments/3d/index.html
          for name in ocean-buoyancy magnet earth-moon plants weather force-motion; do
            test -s "experiments/3d/$name/index.html"
          done
          find modules/experiment-planets/chunks -name '*.js' | grep -q .
      - name: Complete existing site regression checks
        run: npm run check
      - name: Install browser verification tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
      - name: Install Traditional Chinese browser fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Screenshot browser tests at tablet sizes
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/experiment-planets-server.log 2>&1 &
          node scripts/verify-experiment-planets.mjs
          node scripts/verify-tides.mjs
          node scripts/verify-tides3d.mjs
      - name: Upload scenes and quiz screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-planets-acceptance
          path: |
            artifacts/experiment-planets/*.png
            artifacts/tides/*.png
            artifacts/tides3d/*.png
            artifacts/tides3d/*.json
          if-no-files-found: ignore
