name: Firestore owner boundary tests
on:
  pull_request:
    paths: ['firestore.rules', 'tests/firestore-owner-boundaries.emulator.mjs', 'firebase.rules-test.json', '.github/workflows/firestore-rules-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-save --package-lock=false @firebase/rules-unit-testing@4.0.1 firebase@11.10.0 firebase-tools@14.27.0
      - run: npx firebase emulators:exec --config firebase.rules-test.json --only firestore --project demo-learning-planet-audit 'node tests/firestore-owner-boundaries.emulator.mjs'
