name: Verify isolated science curriculum

# Test-only: never dispatch an existing deployment workflow to validate this branch.
on:
  push:
    branches:
      - codex/science-living-curriculum-v2-20261112

permissions:
  contents: read

concurrency:
  group: science-curriculum-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Locked install and complete regression checks
    if: >-
      github.event_name == 'push' &&
      github.repository == 'pc007ya/Learning_Planet' &&
      github.ref == 'refs/heads/codex/science-living-curriculum-v2-20261112'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the triggering commit without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Refuse an unexpected event, repository, branch or revision
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REPOSITORY" = pc007ya/Learning_Planet
          test "$GITHUB_REF" = refs/heads/codex/science-living-curriculum-v2-20261112
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'Testing exact commit: %s\n' "$GITHUB_SHA"

      - name: Set up Node.js without a shared dependency cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install locked dependencies
        run: npm ci

      - name: Run the complete existing check chain
        run: npm run check
