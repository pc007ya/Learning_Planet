name: Deploy Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Apply iPad submodule gesture lock
        run: python3 scripts/patch-ipad-ux.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Check and build deployed modules
        run: npm ci && npm run check

      - name: Stage public site
        run: |
          mkdir -p _site
          rsync -a --exclude='_site' --exclude='node_modules' --exclude='.git' --exclude='.github' --exclude='functions' --exclude='firebase-debug.log' --exclude='src' --exclude='tests' ./ _site/

      - name: Authenticate deployment service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LEARNPLANET }}

      - name: Deploy Firebase Hosting
        run: npx --yes firebase-tools@latest deploy --only hosting --config firebase.hosting.json --project learnplanet-cce52 --non-interactive
