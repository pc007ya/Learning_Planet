name: English original curriculum checks
on:
  pull_request:
    paths:
      - 'modules/english-original/**'
      - 'tests/english-original/**'
      - 'index.html'
      - '.github/workflows/english-original-check.yml'
  push:
    branches: ['english-original-r30-20261116']
permissions:
  contents: read
jobs:
  english:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tests/english-original/content-check.py
      - run: node tests/english-original/navigation.cjs
      - run: node --test tests/english-original/*.check.mjs tests/science-curriculum/reward-host.check.mjs
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python3 scripts/pack-nature-assets.py --verify-manifest
      - run: npm ci
      - run: npm run check

  exploration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/english-original/exploration.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: english-exploration-candidate
          path: qa/english-exploration
