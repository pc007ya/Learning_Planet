<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07182d"><title>潮汐探險｜地球月球｜學習星球</title><link rel="stylesheet" href="./tides.css"></head>
<body>
<div class="shell">
<header><a class="icon" href="../" aria-label="返回地球月球星球">←</a><div class="title"><small>學習星球 · 地球月球</small><h1>潮汐探險</h1></div><button id="quiz-open" class="icon" aria-label="開啟看圖挑戰">✎<small>挑戰</small></button><button id="notes-open" class="icon" aria-label="開啟觀察筆記">▤<small>筆記</small></button><button id="replay" class="icon" aria-label="重聽這一段">↻<small>重聽</small></button><button id="voice" class="icon" aria-label="開啟語音" aria-pressed="false">♫<small>語音</small></button></header>
<nav class="steps" aria-label="四段潮汐探險"><button data-step="0" aria-current="step"><span>1</span>海岸觀察</button><button data-step="1"><span>2</span>拉力的祕密</button><button data-step="2"><span>3</span>日月合作</button><button data-step="3"><span>4</span>台灣看潮汐</button></nav>
<main>
<section class="stage" aria-label="潮汐互動圖"><div class="scene-top"><strong id="scene-title"></strong><span class="badge">理想模型 · 非潮時預報</span></div><svg id="scene" viewBox="0 0 720 400" role="group" aria-label="海岸潮汐示意圖"></svg><div id="scene-caption" class="caption"></div></section>
<aside><div class="lesson"><span class="eyebrow" id="step-number"></span><h2 id="lesson-title"></h2><p id="lesson-text"></p><p id="insight" class="insight"></p></div><div id="controls" aria-label="實驗操作"></div><p id="feedback" role="status" aria-live="polite"></p><div class="next-row"><button id="previous" aria-label="上一段">←</button><span id="progress">1 / 4</span><button id="next" aria-label="下一段">→</button></div></aside>
</main>
<footer><span>海水隆起與距離已誇大；真實海岸受地形、海深與天氣影響。</span><button id="sources-open">資料來源</button></footer>
</div>
<dialog id="overlay" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="dialog-close" class="icon" aria-label="關閉視窗">×</button></div><div id="dialog-body"></div></dialog>
<script type="module" src="../../../../modules/tides/tides.js"></script>
</body></html>
