<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 25% 10%,#224f70 0%,#0a2042 58%,#08172d 100%);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:white}
main{min-height:100svh;max-width:1220px;margin:0 auto;padding:18px;display:flex;flex-direction:column;gap:15px}
header{display:flex;align-items:center;gap:14px}header a,footer a{color:#fff;text-decoration:none;display:inline-grid;place-items:center;min-width:46px;min-height:46px;border-radius:13px;border:1px solid #a9cce0;background:#21486a}
h1{margin:0;font-size:clamp(22px,3vw,36px);line-height:1.25}header p{margin:4px 0;font-size:14px;color:#c6e4f3}
.grid{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(180px,1fr));gap:13px}
.card{background:linear-gradient(155deg,rgba(47,86,116,.86),rgba(13,37,73,.9));border:1px solid #84a5bb;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:white;text-decoration:none;padding:10px;text-align:center;min-width:0;transition:transform .12s,border-color .12s}
.card:hover,.card:focus-visible{border-color:#ffd98a;transform:translateY(-3px)}.card:focus-visible{outline:3px solid #ffd98a;outline-offset:2px}
.card svg{width:clamp(74px,9vh,120px);height:clamp(68px,9vh,112px);flex:0 1 auto;filter:drop-shadow(0 7px 12px #06182c)}
.card strong{font-size:clamp(16px,2vw,24px);font-weight:900}.card span{font-size:12px;line-height:1.35;color:#c9e6f4}
.card:first-child{border-color:#f4d89a;background:linear-gradient(155deg,#1d6d7e,#122b52)}
footer{display:flex;align-items:center;justify-content:space-between;gap:14px;font-size:12px;color:#c9dfe9}footer a{padding:0 12px}
@media(max-height:650px){main{padding:9px;gap:7px}header a{min-height:44px}header p{font-size:12px} .grid{grid-template-rows:repeat(2,minmax(155px,1fr));gap:7px}.card{gap:3px;padding:5px}.card svg{height:62px;width:75px}.card span{font-size:11px}}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(170px,1fr))}footer{flex-wrap:wrap}}
</style>
</head>
